<div class="auth-page">
  <div class="auth-card">
    <img class="app-mark" src="assets/icon.png" alt="">
    <h2>Account suspended</h2>
    <p class="subtitle">You can sign in, but you cannot clock in, request time off, or change anything until an admin
      activates your account.</p>
    <button type="button" class="btn btn-primary btn-full" (click)="signOut()">Sign out</button>
  </div>
</div>
