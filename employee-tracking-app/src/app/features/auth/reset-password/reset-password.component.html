<div class="auth-page">
  <div class="auth-card animate-fade-in">
    <div class="brand">
      <div class="brand-icon"><mat-icon>schedule</mat-icon></div>
      <span class="brand-name">Employee Tracking</span>
    </div>

    <h2>Choose a new password</h2>
    <p class="subtitle">Use at least 8 characters, with a number, a capital letter, and a symbol.</p>

    @if (errorMsg()) {
      <div class="error-banner">
        <mat-icon>error_outline</mat-icon>
        <span>{{ errorMsg() }}</span>
      </div>
    }

    @if (done()) {
      <p class="subtitle">Your password is updated.</p>
      <a routerLink="/login" class="btn btn-primary btn-full btn-lg">Sign in</a>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" class="form">
        <div class="field">
          <label for="password">New password</label>
          <div class="input-wrap">
            <mat-icon>lock_outline</mat-icon>
            <input id="password" type="password" formControlName="password" autocomplete="new-password">
          </div>
        </div>
        <div class="field">
          <label for="confirm">Confirm password</label>
          <div class="input-wrap">
            <mat-icon>lock_outline</mat-icon>
            <input id="confirm" type="password" formControlName="confirm" autocomplete="new-password">
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" [disabled]="saving() || !email || !token">
          {{ saving() ? 'Saving…' : 'Update password' }}
        </button>
      </form>
    }
  </div>
</div>
