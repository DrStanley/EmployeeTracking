
name: Build and deploy EmployeeTracking API to Azure

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore EmployeeTracking.sln

      - name: Build solution
        run: dotnet build EmployeeTracking.sln --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish EmployeeTracking.API/EmployeeTracking.API.csproj --configuration Release --no-build --output ./publish

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: employee-tracking-api
          path: ./publish/

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: employee-tracking-api
          path: ./publish/

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FE494FAB96604015B2CFBAD45A7CAD24 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_336C495595214C4CA8929AAE854C389A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_66E02CEE14B14D4A9C76D6F3A92E57C1 }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: employee-tracking-api
          slot-name: Production
          package: ./publish/
